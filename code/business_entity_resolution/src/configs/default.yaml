# default.yaml — all hyperparameters, paths and flags for the pipeline.
# `env` selects which `paths.*` block is active; notebooks override it via
# the standard first cell (architecture.md SS6.1) or a CLI --env flag.

seed: 42
env: local  # local | kaggle

paths:
  local:
    data_dir: student_resource/dataset
    models_dir: models
    work_dir: output
  kaggle:
    data_dir: /kaggle/input/er-data/student_resource/dataset
    models_dir: /kaggle/input/er-models
    work_dir: /kaggle/working

stats_mode: per_run  # per_run | train_only (fallback, master plan SS9.4 / memory.md Q3)

split:
  a_frac: 0.55
  stratify: [country, match_bucket]

embed:
  model: qwen3-emb-0.6b
  max_len: 64  # records are short; length-sorted batches pad only to the batch max
  batch: 512
  instruction: "Instruct: Represent this business record to find records of the same business\nQuery: "

finetune:
  lr: 2.0e-5
  epochs: 1
  batch: 64
  hard_negs: 3
  scramble_frac: 0.2
  field_dropout: 0.1
  lora_r: 32             # LoRA on all linear layers (memory-safe on a T4 vs full fine-tune)
  max_anchors: 80000     # Half-A anchors sampled for triplets
  time_budget_min: 90    # training stops at this wall-clock budget

blocking:
  dense_k: 30
  reverse_k: 5
  tfidf_name_k: 20
  tfidf_addr_k: 15
  rare_token_cap: 20      # name_tok channel k (rare-token key)
  num_key_k: 20           # house number + street token key (replaces the postcode key: postcodes in ~1-2% of records)
  name_char_max_df: 2000  # index features with df above this are dropped (sparse-product cost)
  addr_char_max_df: 2000
  name_tok_max_df: 200    # "rare" = df <= this within the country group
  num_key_max_df: 200
  pair_k: 30              # name_pair / addr_pair channels (token-pair keys on fold forms)
  pair_max_df: 2000       # v3 used 500 -> B recall 0.952; pair channels are cheap, so widen
  rev_name_k: 3           # v6: reverse name channel, pool -> top-3 S1 (0 = off)
  prune_top: 50
  train_sample_per_half: 250000  # train S1 queries per half (A, B); test uses all S1
  within_country: true  # EDA E5: 0/7,638,365 train pairs cross countries (memory.md SS6)
  translit_name_k: 20     # V7: translit-name / translit-address char TF-IDF channels
  translit_addr_k: 20     # (base k; boosted for queries whose OTHER field is empty -- "adaptive k")
  translit_boost_k: 40
  translit_max_df: 2000
  translit_min_count: 3   # dictionary-entry thresholds (translit.py), tuned on Half A
  translit_min_dice: 0.5

scale_guard:  # millions of records confirmed by EDA E1 (memory.md Q8/SS5)
  enabled: true
  mrl_dim: 256
  faiss_index: ivf  # flat | ivf ; ivf nlist ~= 4*sqrt(N)
  prerank_top: 20

stage1:
  num_leaves: 63
  lr: 0.05
  min_data_in_leaf: 50
  folds: 5
  monotone: auto
  max_rounds: 1500
  max_bin: 127
  a_s1_cap: 150000   # Half-A S1s used for stage-1 training (NB05 queried 250k per half)
  b_s1_cap: 250000   # Half-B S1s scored (all NB05 B queries)

judge:
  model: qwen3-4b
  lora_r: 16
  lora_alpha: 32
  max_len: 384
  lr: 1.0e-4
  train_band: [0.05, 0.95]
  infer_band: [0.10, 0.90]
  time_budget_min: 45
  order_swap_tta: true
  train_n: 20000          # judge training prompts from the A OOF band (plan SS16.4: 12k-20k)
  train_budget_min: 70    # QLoRA training cap; cut from 150 on 27 Sep 11:00 IST to fit the 16:30 hard stop
  infer_budget_min: 60    # NB08 scoring budget for B + test together
  infer_cap_B: 60000      # band pairs prepared for NB08 (most uncertain first)
  infer_cap_test: 200000

combiner:
  num_leaves: 31
  folds: 5
  calibration: isotonic
  lr: 0.08
  min_data_in_leaf: 100
  max_bin: 63
  feature_fraction: 0.7
  max_rounds: 1500
  p_floor: 0.001   # combiner re-scores only pairs with stage-1 p >= this (others keep p1; same on test)

exclusivity: hard  # none | soft | hard; EDA E4: 0/7,638,365 matched IDs shared between two S1s (memory.md SS6) -- still verify on Half B per master plan SS13

decoder:
  lambda_grid: [0.7, 0.85, 1.0, 1.15, 1.3, 1.5]  # 1.3/1.5 added: NB09a v1 picked the old edge (1.15)
  max_n: 20
  min_p: 0.01
